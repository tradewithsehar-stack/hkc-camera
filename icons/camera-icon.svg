<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C769" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#B87B1D" />
    </linearGradient>
    <radialGradient id="lensReflect" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2A3A4A" />
      <stop offset="50%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#080C10" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#262626" stroke-width="4"/>

  <!-- Camera Body Outline -->
  <rect x="88" y="152" width="336" height="236" rx="36" fill="#151515" stroke="#333333" stroke-width="6"/>

  <!-- Top Pentaprism / Viewfinder Bump -->
  <path d="M 188 152 L 208 114 L 304 114 L 324 152 Z" fill="#1C1C1C" stroke="#333333" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Shutter Button Accent -->
  <rect x="124" y="128" width="40" height="24" rx="6" fill="url(#goldGrad)"/>
  
  <!-- Rangefinder Red/Gold Status Dot -->
  <circle cx="370" cy="188" r="7" fill="url(#goldGrad)" filter="url(#subtleGlow)"/>

  <!-- Grip texture lines -->
  <line x1="112" y1="210" x2="112" y2="330" stroke="#252525" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="210" x2="122" y2="330" stroke="#252525" stroke-width="4" stroke-linecap="round"/>

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="270" r="88" fill="#111111" stroke="#383838" stroke-width="6"/>
  <circle cx="256" cy="270" r="78" fill="#0C0C0C" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- Inner Lens Glass -->
  <circle cx="256" cy="270" r="64" fill="url(#lensReflect)"/>
  
  <!-- Lens Glass Highlights -->
  <path d="M 220 236 A 48 48 0 0 1 280 236" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="238" cy="252" rx="14" ry="7" transform="rotate(-30 238 252)" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="276" cy="288" r="4" fill="#60A5FA" opacity="0.4"/>

  <!-- HKC Monogram / Brand mark subtle below -->
  <text x="256" y="440" text-anchor="middle" fill="#8E8E8E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="6">HKC CAMERA</text>
</svg>
